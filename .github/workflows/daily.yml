name: Daily HN Digest

on:
  schedule:
    - cron: "0 14 * * *"  # 14:00 UTC daily (~10am ET / ~7am PT)
  workflow_dispatch:        # also runs on demand from the Actions tab

jobs:
  scrape:
    runs-on: ubuntu-latest
    permissions:
      contents: write       # needed to commit the new CSV back
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Scrape HN
        run: python scrape.py --min-points 100

      - name: Commit & push results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --staged --quiet; then
            echo "No new data to commit."
          else
            git commit -m "data: HN digest $(date -u +%Y-%m-%d)"
            git push
          fi
